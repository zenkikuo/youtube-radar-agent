# 引擎 B：花蓮與宜蘭全網主題關鍵字雷達
topic_radars:
  - tag: "花東雷達-花蓮"
    query: "花蓮 美食 OR 秘境 OR 新開幕 OR 親子"
    category: "travel_outdoor"
    webhook: "travel_local"
    min_score: 4  # 嚴格過濾，4分以上才推播
  - tag: "花東雷達-宜蘭"
    query: "宜蘭 露營 OR 美食 OR 景點 OR 親子"
    category: "travel_outdoor"
    webhook: "travel_local"
    min_score: 4

# 引擎 B 程式端硬性過濾條件
radar_filters:
  min_duration_sec: 240    # 排除 4 分鐘以下短影音 Shorts
  max_duration_sec: 2400   # 排除 40 分鐘以上直播存檔
  blacklist_keywords: ["新聞", "氣象", "地震", "議會", "房仲", "建案", "行車紀錄"]
